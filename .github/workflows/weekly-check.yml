name: AMCドキュメントの週次チェック

on:
  schedule:
    - cron: "0 0 * * 1"   # 毎週月曜 9:00（日本時間）。GitHubの混雑で数十分遅れることがある
  workflow_dispatch:       # Actions画面から手動でも実行できる

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ライブラリとブラウザの準備
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: ドキュメントを取得
        run: python scrape.py

      - name: 変更ページの一覧を作る
        id: summary
        run: |
          git add -A docs amc_all_documentation.md
          status=$(git diff --cached --name-status -- docs)
          echo "added=$(grep -c '^A' <<<"$status" || true)" >> "$GITHUB_OUTPUT"
          echo "modified=$(grep -c '^M' <<<"$status" || true)" >> "$GITHUB_OUTPUT"
          echo "deleted=$(grep -c '^D' <<<"$status" || true)" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<END_OF_BODY'
            echo 'AMC公式ドキュメントに変更がありました。差分は「Files changed」で確認できます。'
            echo ''
            echo '| 種類 | ページ |'
            echo '| --- | --- |'
            sed -E 's#^A\tdocs/#| 追加 | #; s#^M\tdocs/#| 変更 | #; s#^D\tdocs/#| 削除 | #; s#$# |#' <<<"$status"
            echo ''
            echo 'マージ後、amc_all_documentation.md をダウンロードし、ドライブの既存ファイルに「新しい版」としてアップロードしてください。'
            echo 'END_OF_BODY'
          } >> "$GITHUB_OUTPUT"
          git reset -q

      - name: 変更があればPRを作成
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ steps.summary.outputs.body }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs amc_all_documentation.md
          if git diff --cached --quiet; then
            echo "変更なし"
            echo "operation=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c docs-update
          git commit -q -m "AMC公式ドキュメントの更新"
          git push -f origin docs-update
          url=$(gh pr list --head docs-update --state open --json url -q '.[0].url')
          if [ -n "$url" ]; then
            gh pr edit "$url" --body "$PR_BODY"
            echo "operation=updated" >> "$GITHUB_OUTPUT"
          else
            url=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head docs-update \
              --title "AMC公式ドキュメントの更新" --body "$PR_BODY")
            echo "operation=created" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PR: $url"

      - name: Slackに通知（変更あり）
        if: env.SLACK_WEBHOOK_URL != '' && (steps.pr.outputs.operation == 'created' || steps.pr.outputs.operation == 'updated')
        run: |
          text=$(printf '📄 AMC公式ドキュメントに変更がありました\n追加 %s ／ 変更 %s ／ 削除 %s\nPR：%s' \
            "${{ steps.summary.outputs.added }}" "${{ steps.summary.outputs.modified }}" \
            "${{ steps.summary.outputs.deleted }}" "${{ steps.pr.outputs.url }}")
          jq -n --arg text "$text" '{text: $text}' | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Slackに通知（取得失敗）
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          text=$(printf '⚠️ AMCドキュメントの週次チェックが失敗しました\nログ：%s' \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          jq -n --arg text "$text" '{text: $text}' | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
